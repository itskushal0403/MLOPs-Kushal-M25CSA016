dataContractSpecification: 0.9.3
id: urn:datacontract:iot:thermostat
version: 1.0.0

schema:
  type: object
  properties:
    device_id:
      type: string
    temperature_celsius:
      type: number
    battery_level:
      type: number
      minimum: 0.0
      maximum: 1.0

quality:
  - name: temperature_valid
    type: validity
    expression: "temperature_celsius >= -30 AND temperature_celsius <= 60"
    enforcement: hard

  - name: battery_valid
    type: validity
    expression: "battery_level >= 0.0 AND battery_level <= 1.0"
    enforcement: hard
